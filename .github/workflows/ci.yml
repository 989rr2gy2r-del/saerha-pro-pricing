name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Production server smoke test
        run: |
          npx wrangler dev --config .output/server/wrangler.json --local --port 4173 > /tmp/saerha-server.log 2>&1 &
          server_pid=$!
          trap "kill $server_pid 2>/dev/null || true" EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ -o /tmp/saerha-response.html; then
              exit 0
            fi
            sleep 1
          done
          echo "--- server log ---"
          cat /tmp/saerha-server.log
          echo "--- response ---"
          cat /tmp/saerha-response.html 2>/dev/null || true
          exit 1
