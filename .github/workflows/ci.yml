name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: GitHub Pages artifact smoke test
        run: |
          test -f .output/public/index.html
          cp .output/public/index.html .output/public/404.html
          test -f .output/public/404.html
          grep -qi "<html" .output/public/index.html
          echo "GitHub Pages artifact is valid"
