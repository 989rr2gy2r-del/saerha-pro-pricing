name: CI

on:
  push:
    branches:
      - main
      - security-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/lib/server-auth.ts src/routes/api/analyze-order.ts src/routes/api/import-products.ts src/routes/api/supabase-write.ts

      - name: Build
        run: npm run build
